name: Deploy site to GitHub Pages

# The site is static. With no build step, site/ goes up as it is.
# With one build script (demo API answers, page numbers), turn on the build lines below,
# and add the app's source folder to `paths` so the demo follows the app.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # with:
        #   fetch-depth: 0          # only when the build counts commits or reads history
      # Optional build step. Python repo shown; use the repo's own toolchain.
      # - uses: astral-sh/setup-uv@v10
      # - run: uv run python site/scripts/build_demo.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
